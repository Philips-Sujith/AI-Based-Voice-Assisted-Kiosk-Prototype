version: "3.9"

# Runs Redis for local development.
# The backend, mock-security, and mock clients are run manually (see README.md).

services:
  redis:
    image: redis:7-alpine
    container_name: kiosk_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
